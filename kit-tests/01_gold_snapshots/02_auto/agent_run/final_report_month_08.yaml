 \"annual_pillar\": \"Bing Wu (2026 — Unknown Unknown)\"\n  }\n}\n{\n  \"pattern_name\": \"普通格局\",\n  \"is_special\": false,\n  \"alignment_modifier\": 1.0,\n  \"validation_reason\": \"Domain: General / Balanced Integration. Directive: Apply general structural interpretation based on the Month Branch hidden stem relationship to the Day Master. No specific pattern rule dominates.\"\n}\n=== PRE-COMPUTED ENGINE SCORES (AUTHORITATIVE) ===\n\nModule 1 — Void Active: False | 10Y Impact: 13 (stem) / 0 (branch)\nModule 2 — Root: Mao | Status: Fortified\nModule 3 — Friction: 7.199999999999999 | Locked: Year, MonthTransit, Month\nModule 4 — Potency: 50.0\nModule 8 — Composite Score: 73.6 | Rating: A\n\n=== METAPHYSICAL ALIGNMENT ===\nFavorable Elements (Medicine): Fire, Earth\nUnfavorable Elements (Taboo): Wood, Water\n\n=== ACTIVE METAPHYSICAL TRANSITS ===\nClashes: No active clashes for this month.\nCombinations: No active combinations for this month.\n\n=== CLASSICAL REFERENCES ===\n--- Reference (Keyword: 桃花) ---\n[Reference 1 — Source: san_ming_tong_hui]\n冶号咸池并集来临祸应期酒色相刑三二位更加神煞血光随详诸书见咸池非吉煞日时与水命遇之尢凶\n　　论六害\n　　因昼夜隂阳之气感而六合因六合而生六害因六害而忌昼夜隂阳之气六害者十二支凌战之辰也子未相害者谓未旺土亥子旺水名势家相害故子见未则为害\n　　丑午相害者谓午以旺火凌丑死金名官鬼相害故丑见午而午更带丑干之真鬼则为害尢甚\n　　寅巳相害者谓各恃临官擅能而进相害若干神往来有鬼者尢甚况刑在其中尢不可不加减灾福言之卯辰相害者谓卯以旺木凌辰死土此以少淩长相害故辰见卯而卯更带辰干真鬼则其害尢甚\n　　申亥相害者谓各恃临官竞嫉才能争进相害故申见亥亥见申均为害更纳音相尅者重\n　　酉戍相害者谓戍以死火害酉旺金此嫉妬相害故酉人见戍则防戍人见酉无灾若乙酉人得戊戌乙为真金戊为真火为害尢甚\n\n---\n\n[Reference 2 — Source: san_ming_tong_hui]\n贵神归一不杂气纯清逺别无死絶等件恶神相犯准上文】\n　　论文学业特精英长生徳秀殢酒惜花偏落魄身旺咸池\n　　【长生帝旺四贵等处徳秀二神文学才能艺术特达精专出类防萃人也殢酒惜花日干旺于咸池之上一也本身自旺受沐浴之神尅者二也本身太旺沐浴更多福气散漫不聚三也】\n　　妻遇比肩旺夺非是良人财因沐浴强争难辞淫浊【妻干或隠或显而切切遇比肩相近相亲其位被占夺又或比肩乘旺其妻必与外人私通不然娶婢妾娼妓为婚免此丑五行败处为沐浴又名桃花咸池煞一例同防其神若来乘势争财或财立其上被他神所窃战者我身兼与用神之气不聚不敛精神散漫准上文】\n\n---\n\n[Reference 3 — Source: ming_li_tan_yuan]\n。\n\n　　以日主为主，如寅午戌日，纳音又属火，见卯月卯时皆是。申子辰日，纳音又属水，见酉月酉时皆是。《幽微赋》云：酒色猖狂，只为桃花带煞。\n\n　　原注云：《淮南子》曰：日出扶桑，人于咸池，故五行沐浴之地，名咸池。是取日入之义。万物暗昧之时也。寅午戌合火局，长生于寅，沐浴于卯，故卯为咸池。巳酉丑合金局，长生于巳，沐浴于午，故以午为咸池，余仿此。\n\n　　羊刃 对宫曰飞刃，又曰唐符\n\n　　《渊海子平》云：甲日羊刃在卯，乙日羊刃在辰，丙戊日羊刃在午，丁己日在未，庚日羊刃在酉，辛日羊刃在戌，壬日羊刃在子，癸日羊刃在丑。\n\n　　如甲日，见卯年卯月卯时皆是。经云：煞刃两停，位之候王。又云：身强遇刃，灾祸勃然。\n\n　　希夷曰：阴阳万物之理，皆恶极盛，当其极处，火则焦灭，水则溃竭，金则破缺，土则崩裂，木则摧折，故既成而未极则为吉，已极则反为凶。极盛之地，十干中正处是也。\n\n--- Reference (Keyword: 姻缘) ---\n[Reference 1 — Source: shen_feng_tong_kao]\n日为主者，行君之令，法运四时，阴阳刚柔之情，内外否泰之道。\n    以生日为主者，以所生之日干为主。譬之人臣也，行君之令者 即主行月令，提纲所起之运也，言君者，即本命年庚也。如本命甲子，年即是岁君。正月生，月令建丙寅。男命则运顺行丁卯戊辰，故谓以日为主者，盖以其为如人臣，主行岁君所建之月令，为命运也。法运四时者，法者，理也。运者，行运也。四时者，春夏秋冬也。子平之理，如运行寅卯辰，则属春，行巳午未，则属夏之类是也。阴阳刚柔之情者，盖甲丙戊庚壬为阳，乙丁己辛癸为阴，阳之性情则刚，阴之性情则柔也。内外否泰之道者，盖十二支中所藏人元，谓之内，十干露出谓之外。否者塞也。泰者，通也。若八字中，天干阴阳，刚柔配合有情，地之提纲所藏人元用神或财或官或印，行生旺胎养运。则吉而向泰，行死墓绝运，则凶而向否。\n进退相倾。\n    赋云：将来者进，成功者退，盖春木夏火秋金冬水，与夫四季之土，其气进也。\n\n---\n\n[Reference 2 — Source: san_ming_tong_hui]\n运抑则頽弱则泛没更若冲并此身之主岂能安然恬静不摇无此理也】\n　　年月日时干支有序君臣賔主体格朝伦\n　　【月干宜在年干之次时干宜在日干之次若或循环次第又竒年爲君日爲主月时如賔如臣辅佐贵气兼似前法有次朝其纲常辅其伦序正其尊严又云阳欲慎独阴欲羣随仍察贵煞所加之处】\n　　日主最喜先干日主应嫌次位\n　　【日主先干如甲日见癸之类此等其益有三一能合戊财资我一能善于长发我一能化其象生我但巳往之气稍慢日主次位如甲见乙之类此等其损有四一能刼妻财空我一能合煞损我一能化象以泄我气一能拦截前路作刃害我】\n　　支神前气支神后宫\n　　【地支迎前之气多者平生爲人精神磊落如甲子年或子日见丑寅邜辰已之类是也地支后宫者主作事悔屯或折挫进退多端如甲子年或子日见亥戌申未之类是也余仿此】\n　　独掉嵗君孤虚日主\n\n---\n\n[Reference 3 — Source: di_tian_sui]\n抑之。是不可以一端论也。\n如日主旺，提纲或官或财或食伤，皆可为用；日主衰，别寻四柱干支有帮身者为用。提纲是禄刃，即以提纲为体，看其大势，以四柱干支食神财官，寻其得所者而用之。\n如四柱干支财杀过旺，日主旺中变弱，须寻其帮身制化财杀者而用之。日主为体者，日主旺，印绶多，必要财星为用；日主旺，官杀轻，亦以财星为用。日主旺，比劫多 ，耐我财星，以食伤为用；日主旺，比劫多，而财星轻，亦以食伤为用。日主旺，官星轻，銕绶重，以财星为用；日主弱，官杀旺，则以印绶为用，日主弱，食伤多，亦以印绶为用；日主弱，财星旺，则以比劫为用。日主与官杀两停者，则以食伤为用；日主与财星均敌者，则以印比为用。此皆用神之的当者也。\n如日主不能为力，合别干而化，化之真者，即以化神为体。化神有余，则以泄化神之神为用；化神不足，则以生助化神之神为用。\n\n--- Reference (Keyword: 婚恋) ---\n[Reference 1 — Source: san_ming_tong_hui]\n柱无冲破　　　富贵命中该】\n　　壬庚会合时临午　无破无冲福自来\n　　从此利名皆有望　贵人举荐上天阶\n　　庚日时临壬午支中官印俱藏贵人禄马更同鄕祸患潜消福长尅破刑冲不吉柱中更忌空亡将星天乙主荣昌中暮家门兴旺\n　　六庚日未时断\n　　六庚日生时癸未　官星魁制权星退\n　　柱中见巳不逢丁　却能显达得官位\n　　庚日癸未时印财库庚以乙为财未中入库用丁为官巳为印未中己丁却有明癸制之柱有巳制癸不透丁字居官显达若无巳透丁为祸百端通火土运气贵\n　　庚子日癸未时年月无丁透露有巳土制伏癸水者贵【己夘郑王贤诬发髙　　丁酉益王三十六子庚午　墙复正位　　　己酉壬子富戊申】\n　　庚寅日癸未时贵辰戌丑未月髙夏富岁运同巳酉申月身旺大贵\n　　【戊子汪俊尚书　　　　辛巳曽于拱都宪庚申　　　　　　　　辛夘】\n　　【辛酉王士翘都宪　　　戊子太守　乙亥御史癸巳　　　　　　　　甲子　　　戊子癸夘宪副乙丑】\n\n---\n\n[Reference 2 — Source: san_ming_tong_hui]\n日戊辰时遇柱中要戊相扶财官运气展良图喜遇钱龙守库辛庚透干贵显壬癸滋助不枯只怕比刼弟兄多歳运逢之有祸\n　　六甲日己巳时断\n　　六甲日生时己巳　病中财物实难任月通火气方为贵　若是身衰亦不禁\n　　甲日己巳时食旺身衰甲木巳上病虽有暗戊为财丙为食不通月气难任其福甲巳为平头煞生逢春月身旺财衰主骨肉参商平生作事弄巧成拙己巳金神有火制伏己酉丑合局行南方运名重禄髙柱不见火残害化气主凶恶暴亡\n　　甲子日己巳时先贫后富祖业轻微妻勤子拗生寅未巳丑年月虽贵防疾申子辰戌大贵【神白经云】化气主贵\n　　【癸未岳武　戊寅布政　甲子通判　癸酉指挥乙卯　穆　己未　　　癸酉　　　丁巳\n　　辛未陈熈昌长科　　　辛未解经邦经畧丁酉　　　　　　　　丁酉】\n　　甲寅日己巳时时日相刑忧伤妻子生火年月有明断之才掌兵权之职戊子年月承袭父防主富\n　　【庚午进士　辛未县丞　丁卯解经雅吏科壬午　　　甲午　富　庚戌】\n\n---\n\n[Reference 3 — Source: di_tian_sui]\n透而得禄，财星藏而归库，格局未尝不美，所嫌者，丑时伤官肆逞，官星退气，日主衰弱，全赖乙木生火而卫官。年月官印相生，亦出身官家，至亥支入泮；壬戌水通根，破耗异常加捐出仕，不过清规；至酉运，财星坏印，竟伏国刑。\n\n乙卯\n丁亥\n戊午\n丙辰丙戌\n乙酉\n甲申\n癸未\n壬午\n辛巳\n戊土生于孟冬，财星临旺，官印双清坐禄，日元临旺逢生，四柱纯粹可观，一行生化有情，喜用皆有精神，所以行运不破局，身出官家，连登科甲，五笔型五子皆登仁籍，富贵福寿之造也。\n\n丁巳\n辛亥\n戊子\n戊午庚戌\n己酉\n戊申\n丁未\n丙午\n乙巳\n此造柱中三火二土，似乎旺相，不知亥子当权，冲坏印绶，天干火土虚脱，其祖上大富，至父辈破败；兼之初运西金地，生助旺水，半生颠连不遇。及交丁未，运转南方，接连丙午二十年，大遂经营之愿，发财十余万。\n\n乙亥\n辛巳\n丙辰\n癸巳庚辰\n己卯\n戊寅\n丁丑\n丙子\n乙亥\n\n=== TARGET MONTH ===\nMonth: Ding You (stem=Ding, branch=You)\n\n=== TASK ===\nGenerate a detailed Relationship advisory narrative of at least 150 words.\nYou MUST directly address the user's specific concern:\n\"\nUSER TAILORING CONTEXT — CRITICAL:\nThe user has shared specific concerns for their 2026 forecast.\nYou MUST address each of these concerns directly and explicitly in every monthly report.\nDo NOT give generic advice — make the narrative speak to these exact situations.\n\nCAREER CONCERN: \"Is this a good year to seek a promotion or salary raise in my current role?\"\nRELATIONSHIPS CONCERN: \"What are my prospects for meeting a new romantic partner this year?\"\nWEALTH CONCERN: \"Is 2026 favorable for aggressive investments and new wealth creation?\"\n\nFor every month:\n- Under career advisory: address their specific career concern\n- Under relationships advisory: address their relationships concern\n- Under wealth advisory: address their wealth concern\nIntegrate these concerns into the narrative naturally, not as a template.\n\"\n",
