ual_pillar\": \"Bing Wu (2026 — Unknown Unknown)\"\n  }\n}\n{\n  \"pattern_name\": \"普通格局\",\n  \"is_special\": false,\n  \"alignment_modifier\": 1.0,\n  \"validation_reason\": \"Domain: General / Balanced Integration. Directive: Apply general structural interpretation based on the Month Branch hidden stem relationship to the Day Master. No specific pattern rule dominates.\"\n}\n=== PRE-COMPUTED ENGINE SCORES (AUTHORITATIVE) ===\n\nModule 1 — Void Active: False | 10Y Impact: 13 (stem) / 0 (branch)\nModule 2 — Root: Mao | Status: Fortified\nModule 3 — Friction: 7.199999999999999 | Locked: Year, MonthTransit, Month\nModule 4 — Potency: 50.0\nModule 8 — Composite Score: 73.6 | Rating: A\n\n=== METAPHYSICAL ALIGNMENT ===\nFavorable Elements (Medicine): Fire, Earth\nUnfavorable Elements (Taboo): Wood, Water\n\n=== ACTIVE METAPHYSICAL TRANSITS ===\nClashes: No active clashes for this month.\nCombinations: No active combinations for this month.\n\n=== CLASSICAL REFERENCES ===\n--- Reference (Keyword: 财运) ---\n[Reference 1 — Source: di_tian_sui]\n限量。（新增）\n\n壬辰\n壬寅\n甲寅\n庚午癸卯\n甲辰\n乙巳\n丙午\n丁未\n戊申\n己酉\n庚戌\n同邑王姓造。俗以身强杀浅论，取庚金为用，谓春木逢金，必作栋梁之器，劝其读书必发；至三旬外，不但读书未售，而且家业渐销，嘱余推之。观其支坐两寅，乘权当令，干透两壬，生助旺神，年支之辰土，乃水之库，木之余气，能蓄水养木，不能生金，一点庚金，休囚已极，且午火敌之，壬水泄之，不惟无用，反为生水之病。大凡旺之极者，宜泄而不宜克，宜顺其气势，弗悖其性也。以午火为用，将来运至火地，虽不贵于名，定当富于利，如再守芸窗，终身误矣。彼即弃儒就经营，至丙午运，克尽庚金之病，不满十年，发财十余万，则庚金为病明矣。\n \n癸酉\n甲子\n癸亥\n辛酉癸亥\n壬戌\n辛酉\n庚申\n己未\n戊午\n丁巳\n丙辰\n此福建人不知姓氏，庚午冬，余推之，大取金水运，不取火土。\n\n---\n\n[Reference 2 — Source: di_tian_sui]\n壬申\n己酉\n庚子\n庚辰庚戌\n辛亥\n壬子\n癸丑\n甲寅\n乙卯\n此造秋金秉令，木火全无。金太旺者，似火也。亥运壬水坐禄，早游泮水，壬子运用神临旺，撞破烟楼，高攀月桂；癸丑合去壬水旺地，囊内青蚨成蝶舞，枝上子规月下啼；甲寅乙卯，尚有制土卫水之功，仁路清高，枫叶未应毡共冷，梅开早觉笔先香。\n\n庚申\n乙酉\n庚戌\n庚辰丙戌\n丁亥\n戊子\n己丑\n庚寅\n辛卯\n此造支类西方，又逢厚土，金旺极者，似水也。初运火，祖业无恒；至戊子运获厚利，纳房出仁已丑庚运，名利皆遂；一交寅运，犯事落职，大破财利；至卯不禄。\n\n己卯\n庚午\n辛卯\n甲午己巳\n戊辰\n丁卯\n丙寅\n乙丑\n甲子\n辛金生于促夏，地支皆逢财杀。金太衰者，似土也。初运己巳戊辰，晦火生金，求名多滞，作事少成；一交丁卯，木火并旺，如枯苗得雨，勃然而兴，似鸿毛遇风，飘然而起，家业丰裕交丑生金泄火，不禄。\n\n己亥\n丁卯\n庚寅\n丙子丙寅\n乙丑\n甲子\n癸亥\n壬戌\n辛酉\n\n---\n\n[Reference 3 — Source: qiong_tong_bao_jian]\n九月庚金：\n九月庚金，戊土司令，最怕土厚埋金，宜先用甲疏，後用壬洗，则金自出矣，忌见己土浊壬。\n壬甲两透，科甲相宜，或甲透壬藏，乡魁可望，甲藏壬透，廪贡堪谋，有甲无壬，犹有学问，有壬无甲，莫问衣衿，壬甲两无，则为下格。\n或支成水局，丙透救之，此人才高迈众，名重乡闾，不见癸水，一榜可许。\n或四柱戊多金旺，全无甲壬者，即有衣禄，亦不能久，或庚戊多无壬甲者，愚顽之辈。\n　　　 \n时日月年\n甲庚戊辛\n申申戌酉\t时日月年\n辛庚丙庚\n巳戌戌寅\t时日月年\n辛庚戊辛\n巳申戌酉\n\n　　\n十月庚金：\n十月庚金，水冷性寒，非丁莫造，非丙不暖。\n丁甲两透，支无水局，一榜有之，支藏丙火，桃浪之仙，支见亥子，得己出制，亦有功名。\n若见丙透无丁者，无显达，丁藏甲透，武职之人，以上不合者，庸俗。\n如金水混杂，全无丙丁者，鄙夫，支成金局，无火者，僧道之命也，书曰，水冷金寒爱丙丁。\n　 \n时日月年\n壬庚辛丁\n\n--- Reference (Keyword: 正财) ---\n[Reference 1 — Source: shen_feng_tong_kao]\n日为主者，行君之令，法运四时，阴阳刚柔之情，内外否泰之道。\n    以生日为主者，以所生之日干为主。譬之人臣也，行君之令者 即主行月令，提纲所起之运也，言君者，即本命年庚也。如本命甲子，年即是岁君。正月生，月令建丙寅。男命则运顺行丁卯戊辰，故谓以日为主者，盖以其为如人臣，主行岁君所建之月令，为命运也。法运四时者，法者，理也。运者，行运也。四时者，春夏秋冬也。子平之理，如运行寅卯辰，则属春，行巳午未，则属夏之类是也。阴阳刚柔之情者，盖甲丙戊庚壬为阳，乙丁己辛癸为阴，阳之性情则刚，阴之性情则柔也。内外否泰之道者，盖十二支中所藏人元，谓之内，十干露出谓之外。否者塞也。泰者，通也。若八字中，天干阴阳，刚柔配合有情，地之提纲所藏人元用神或财或官或印，行生旺胎养运。则吉而向泰，行死墓绝运，则凶而向否。\n进退相倾。\n    赋云：将来者进，成功者退，盖春木夏火秋金冬水，与夫四季之土，其气进也。\n\n---\n\n[Reference 2 — Source: san_ming_tong_hui]\n运抑则頽弱则泛没更若冲并此身之主岂能安然恬静不摇无此理也】\n　　年月日时干支有序君臣賔主体格朝伦\n　　【月干宜在年干之次时干宜在日干之次若或循环次第又竒年爲君日爲主月时如賔如臣辅佐贵气兼似前法有次朝其纲常辅其伦序正其尊严又云阳欲慎独阴欲羣随仍察贵煞所加之处】\n　　日主最喜先干日主应嫌次位\n　　【日主先干如甲日见癸之类此等其益有三一能合戊财资我一能善于长发我一能化其象生我但巳往之气稍慢日主次位如甲见乙之类此等其损有四一能刼妻财空我一能合煞损我一能化象以泄我气一能拦截前路作刃害我】\n　　支神前气支神后宫\n　　【地支迎前之气多者平生爲人精神磊落如甲子年或子日见丑寅邜辰已之类是也地支后宫者主作事悔屯或折挫进退多端如甲子年或子日见亥戌申未之类是也余仿此】\n　　独掉嵗君孤虚日主\n\n---\n\n[Reference 3 — Source: di_tian_sui]\n抑之。是不可以一端论也。\n如日主旺，提纲或官或财或食伤，皆可为用；日主衰，别寻四柱干支有帮身者为用。提纲是禄刃，即以提纲为体，看其大势，以四柱干支食神财官，寻其得所者而用之。\n如四柱干支财杀过旺，日主旺中变弱，须寻其帮身制化财杀者而用之。日主为体者，日主旺，印绶多，必要财星为用；日主旺，官杀轻，亦以财星为用。日主旺，比劫多 ，耐我财星，以食伤为用；日主旺，比劫多，而财星轻，亦以食伤为用。日主旺，官星轻，銕绶重，以财星为用；日主弱，官杀旺，则以印绶为用，日主弱，食伤多，亦以印绶为用；日主弱，财星旺，则以比劫为用。日主与官杀两停者，则以食伤为用；日主与财星均敌者，则以印比为用。此皆用神之的当者也。\n如日主不能为力，合别干而化，化之真者，即以化神为体。化神有余，则以泄化神之神为用；化神不足，则以生助化神之神为用。\n\n--- Reference (Keyword: 偏财) ---\n[Reference 1 — Source: di_tian_sui]\n限量。（新增）\n\n壬辰\n壬寅\n甲寅\n庚午癸卯\n甲辰\n乙巳\n丙午\n丁未\n戊申\n己酉\n庚戌\n同邑王姓造。俗以身强杀浅论，取庚金为用，谓春木逢金，必作栋梁之器，劝其读书必发；至三旬外，不但读书未售，而且家业渐销，嘱余推之。观其支坐两寅，乘权当令，干透两壬，生助旺神，年支之辰土，乃水之库，木之余气，能蓄水养木，不能生金，一点庚金，休囚已极，且午火敌之，壬水泄之，不惟无用，反为生水之病。大凡旺之极者，宜泄而不宜克，宜顺其气势，弗悖其性也。以午火为用，将来运至火地，虽不贵于