官杀轻，亦以财星为用。日主旺，比劫多 ，耐我财星，以食伤为用；日主旺，比劫多，而财星轻，亦以食伤为用。日主旺，官星轻，銕绶重，以财星为用；日主弱，官杀旺，则以印绶为用，日主弱，食伤多，亦以印绶为用；日主弱，财星旺，则以比劫为用。日主与官杀两停者，则以食伤为用；日主与财星均敌者，则以印比为用。此皆用神之的当者也。\n如日主不能为力，合别干而化，化之真者，即以化神为体。化神有余，则以泄化神之神为用；化神不足，则以生助化神之神为用。\n\n--- Reference (Keyword: 官运) ---\n[Reference 1 — Source: san_ming_tong_hui]\n无穷矣徐子平识破此理故只论财官印食分为六格而人命之富贵贫贱夀夭穷通举不外是其余格局不过自此而推之耳\n　　论正官【喜身旺　印绶　食神　以财为引逢官防财\n　　忌身弱　偏官　伤官　刑冲泄气　贪合　入墓】\n　　【一曰正官二曰禄神】\n　　正官者乃甲见辛乙见庚之例隂阳配合相制有用成其道也故正官为六格之首止许一位多则不宜正官先防月令然后方防其余以五行之气惟月令当时为最况四柱各管年限年管十五失之太早时管五十后失之太迟故只此月令为正余格例此甲日生酉月乙生申巳丙生子丁生亥戊生卯己生寅庚生午辛生寅巳壬生午未丑癸生辰巳戌月皆为正气官星更天干透出如甲见辛酉乙见庚申之例谓之支藏干透余位不宜再见又湏日主徤旺得财印两扶柱中不见伤煞行运引至官乡大富大贵命也大忌刑冲破害伤官七煞贪合防官刼财分福为破格如甲生酉月见卯为冲酉为刑午为破戌为害丙为合乙为刼丁为伤克庚为混杂湏是官星纯一五行和粹方以正官论若见前忌柱中虽有物去之亦不纯粹若官\n\n---\n\n[Reference 2 — Source: yuan_hai_zi_ping]\n玉堂金马坐朝臣。\n\n　　《诗诀》正官大抵要身强，气弱须求运旺方；岁运更逢生旺地，无冲无破是荣昌。\n\n　　《诗诀》己干为主透官星，须要提纲见丙丁；金水相生成下格，火来拘聚旺财名。\n\n　　《诗诀》辛日透丙月逢寅，格中返化发财根；官星不许重相见，运到冲刑怕酉申。\n\n　　《诗诀》八月官星得正名，格中大怕卯和丁；若还柱内去其忌，运亦如之贵显名。\n\n　\n论　　偏　　官》 \n　　夫偏官者，盖甲木见庚金之类；阳见阳，阴见阴，乃谓之偏官，不成配偶，犹如经言：『二女不能同居，二男不可并处』是也。\n\n　　偏官即七杀，要制伏，盖偏官七杀即小人；小人无知，多凶暴，无忌惮，乃能劳力以养君子，而服役护御君子者。\n小人也，惟是不惩不戒，无术以控制之，则不能驯伏而为用；故，杨子曰：『御得其道，则驯伏或作使；御失其道，则狙诈或作敌。\n』小人者，狙诈也，要控御得其道矣；一失控御，小人得权，则祸立见矣！\n\n---\n\n[Reference 3 — Source: qian_li_ming_gao]\n。已近黄土当权。土克水为正官。年支辰土。又是正官。时上辛酉干支。皆金。金生水为印。则局中。有官有印。理当飞黄腾达。宦海航行。何今屈居市尘经理质物为事。寄人篱下。辛苦万状。厥故维何。要知官星宜露。露则清高。今辰戍之官。藏而不露。一也。辰戍冲。官与官自起冲突。二也。官既不透。而与官作仇之伤官。加盖两官之上。三也。有是三者。宦海无缘。乃致朝奉头衔。加於身上矣。本命伤官透露。英华外发。作事精明。涉足近东南为妙。住家离祖基相宜。行运以戊寅己卯大佳。\n\n辛亥\n辛丑\n甲午\n癸酉\t七岁 壬寅\n十七 癸卯\n廿七 甲辰\n三七 乙巳\n四七 丙午\n五七 丁未\n六七 戊申\t \n此南京杜霭移先生次女公子。锡贞女之命也。杜公历任苏省南汇江阴江浦等县知事多年。政绩卓著。敝友蒋清渠先生 。蒙杜公延请办理司法。兼第一科行政。相处多年，彼此投契。近有某君为女士作伐。与某公子撮合。杜公深悉蒋君精於命理。请其推评而决焉。\n\n--- Reference (Keyword: 升职) ---\n[Reference 1 — Source: san_ming_tong_hui]\n己丑\n　　乙丑臧尔劝　　　　　己酉举人知州乙酉　侍郎　　　　　癸酉】\n　　【己亥公弟巨富癸酉】\n\n　　丙辰日己亥时日徳格寅月生吉辰月为僧道主富平人孤尅戌月冲辰巳月冲亥丙旺库俱吉卯未防行金水运申子防行木火运俱贵【神白经云】火土化须有福只寿夭\n　　【己巳太守　壬午州牧　己巳举人　甲午经厯丙寅　　　庚戌　　　壬申　　　丁丑丁酉丞相戊申】\n　　丙午日己亥时武贵寅巳午月生妻重子晚不贵即富秋冬名利进退酉午戌大贵\n　　【甲子李遂侍郎　　　　戊戌李敬状元癸酉　　　　　　　　乙卯】\n　　【庚子政　丁卯谏垣　辛未佥宪　丁卯进士己卯　　　壬寅　　　丁酉　　　甲辰乙亥举人　壬午主事　庚申宪长癸未　　　丁未　　　丁亥】\n　　丙申日己亥时春夏生移根换叶就妻改福秋冬平常酉月行东南运风宪\n\n---\n\n[Reference 2 — Source: san_ming_tong_hui]\n知县　丁未举人　丙申进士庚辰　　　甲午　　　壬子　　　丁酉丁酉赵参鲁庶吉士谪典史癸丑　歴陞尚书】\n\n　　【壬日乙巳局　　　柱中莫见官见之防不足　　　刑害事多端】\n　　壬日时逢乙巳临　谋为未遇且沈吟\n　　贵人举荐财官旺　子嗣鸳帏不一心\n　　壬日时临乙巳伤官背禄无取虽然天乙贵人扶贵显遇而不遇谋望云为反覆生平实事成虚时来发达改门闾犹似旱苗得雨\n　　六壬日午时断\n　　六壬日生时丙午　聚财之地坐胞胎\n　　月逢金水须富贵　弃命从来是就财\n　　壬日丙午时禄马三奇壬以己为官丙丁为财午上丁巳是禄马壬水受胎有倚托通金水月气就财生旺主富贵通火气亦贵\n　　壬子日丙午时公直撑持孤高而贵年月子午字重水火既济极品【一云】旺中失伤妻子\n　　【壬辰太守　丙午大贵　戊戌女命夫子进士乙巳　　　壬子　　　癸亥己酉举人乙亥】\n　　壬寅日丙午时寅午戌月财星格但嫌身弱宜僧道吉秋生印绶冬身旺行金火运金紫\n\n---\n\n[Reference 3 — Source: qian_li_ming_gao]\n。已近黄土当权。土克水为正官。年支辰土。又是正官。时上辛酉干支。皆金。金生水为印。则局中。有官有印。理当飞黄腾达。宦海航行。何今屈居市尘经理质物为事。寄人篱下。辛苦万状。厥故维何。要知官星宜露。露则清高。今辰戍之官。藏而不露。一也。辰戍冲。官与官自起冲突。二也。官既不透。而与官作仇之伤官。加盖两官之上。三也。有是三者。宦海无缘。乃致朝奉头衔。加於身上矣。本命伤官透露。英华外发。作事精明。涉足近东南为妙。住家离祖基相宜。行运以戊寅己卯大佳。\n\n辛亥\n辛丑\n甲午\n癸酉\t七岁 壬寅\n十七 癸卯\n廿七 甲辰\n三七 乙巳\n四七 丙午\n五七 丁未\n六七 戊申\t \n此南京杜霭移先生次女公子。锡贞女之命也。杜公历任苏省南汇江阴江浦等县知事多年。政绩卓著。敝友蒋清渠先生 。蒙杜公延请办理司法。兼第一科行政。相处多年，彼此投契。近有某君为女士作伐。与某公子撮合。杜公深悉蒋君精於命理。请其推评而决焉。\n\n=== WEALTH CLASSICAL REFERENCES ===\n--- Reference (Keyword: 财运) ---\n[Reference 1 — Source: di_tian_sui]\n限量。（新增）\n\n壬辰\n壬寅\n甲寅\n庚午癸卯\n甲辰\n乙巳\n丙午\n丁未\n戊申\n己酉\n庚戌\n同邑王姓造。俗以身强杀浅论，取庚金为用，谓春木逢金，必作栋梁之器，劝其读书必发；至三旬外，不但读书未售，而且家业渐销，嘱余推之。观其支坐两寅，乘权当令，干透两壬，生助旺神，年支之辰土，乃水之库，木之余气，能蓄水养木，不能生金，一点庚金，休囚已极，且午火敌之，壬水泄之，不惟无用，反为生水之病。大凡旺之极者，宜泄而不宜克，宜顺其气势，弗悖其性也。以午火为用，将来运至火地，虽不贵于名，定当富于利，如再守芸窗，终身误矣。彼即弃儒就经营，至丙午运，克尽庚金之病，不满十年，发财十余万，则庚金为病明矣。\n \n癸酉\n甲子\n癸亥\n辛酉癸亥\n壬戌\n辛酉\n庚申\n己未\n戊午\n丁巳\n丙辰\n此福建人不知姓氏，庚午冬，余推之，大取金水运，不取火土。\n\n---\n\n[Reference 2 — Source: di_tian_sui]\n壬申\n己酉\n庚子\n庚辰庚戌\n辛亥\n壬子\n癸丑\n甲寅\n乙卯\n此造秋金秉令，木火全无。金太旺者，似火也。亥运壬水坐禄，早游泮水，壬子运用神临旺，撞破烟楼，高攀月桂；癸丑合去壬水旺地，囊内青蚨成蝶舞，枝上子规月下啼；甲寅乙卯，尚有制土卫水之功，仁路清高，枫叶未应毡共冷，梅开早觉笔先香。\n\n庚申\n乙酉\n庚戌\n庚辰丙戌\n丁亥\n戊子\n己丑\n庚寅\n辛卯\n此造支类西方，又逢厚土，金旺极者，似水也。初运火，祖业无恒；至戊子运获厚利，纳房出仁已丑庚运，名利皆遂；一交寅运，犯事落职，大破财利；至卯不禄。\n\n己卯\n庚午\n辛卯\n甲午己巳\n戊辰\n丁卯\n丙寅\n乙丑\n甲子\n辛金生于促夏，地支皆逢财杀。金太衰者，似土也。初运己巳戊辰，晦火生金，求名多滞，作事少成；一交丁卯，木火并旺，如枯苗得雨，勃然而兴，似鸿毛遇风，飘然而起，家业丰裕交丑生金泄火，不禄。\n\n己亥\n丁卯\n庚寅\n丙子丙寅\n乙丑\n甲子\n癸亥\n壬戌\n辛酉\n\n---\n\n[Reference 3 — Source: qiong_tong_bao_jian]\n九月庚金：\n九月庚金，戊土司令，最怕土厚埋金，宜先用甲疏，後用壬洗，则金自出矣，忌见己土浊壬。\n壬甲两透，科甲相宜，或甲透壬藏，乡魁可望，甲藏壬透，廪贡堪谋，有甲无壬，犹有学问，有壬无甲，莫问衣衿，壬甲两无，则为下格。\n或支成水局，丙透救之，此人才高迈众，名重乡闾，不见癸水，一榜可许。\n或四柱戊多金旺，全无甲壬者，即有衣禄，亦不能久，或庚戊多无壬甲者，愚顽之辈。\n　　　 \n时日月年\n甲庚戊辛\n申申戌酉\t时日月年\n辛庚丙庚\n巳戌戌寅\t时日月年\n辛庚戊辛\n巳申戌酉\n\n　　\n十月庚金：\n十月庚金，水冷性寒，非丁莫造，非丙不暖。\n丁甲两透，支无水局，一榜有之，支藏丙火，桃浪之仙，支见亥子，得己出制，亦有功名。\n若见丙透无丁者，无显达，丁藏甲透，武职之人，以上不合者，庸俗。\n如金水混杂，全无丙丁者，鄙夫，支成金局，无火者，僧道之命也，书曰，水冷金寒爱丙丁。\n　 \n时日月年\n壬庚辛丁\n\n--- Reference (Keyword: 正财) ---\n[Reference 1 — Source: shen_feng_tong_kao]\n日为主者，行君之令，法运四时，阴阳刚柔之情，内外否泰之道。\n    以生日为主者，以所生之日干为主。譬之人臣也，行君之令者 即主行月令，提纲所起之运也，言君者，即本命年庚也。如本命甲子，年即是岁君。正月生，月令建丙寅。男命则运顺行丁卯戊辰，故谓以日为主者，盖以其为如人臣，主行岁君所建之月令，为命运也。法运四时者，法者，理也。运者，行运也。四时者，春夏秋冬也。子平之理，如运行寅卯辰，则属春，行巳午未，则属夏之类是也。阴阳刚柔之情者，盖甲丙戊庚壬为阳，乙丁己辛癸为阴，阳之性情则刚，阴之性情则柔也。内外否泰之道者，盖十二支中所藏人元，谓之内，十干露出谓之外。否者塞也。泰者，通也。若八字中，天干阴阳，刚柔配合有情，地之提纲所藏人元用神或财或官或印，行生旺胎养运。则吉而向泰，行死墓绝运，则凶而向否。\n进退相倾。\n    赋云：将来者进，成功者退，盖春木夏火秋金冬水，与夫四季之土，其气进也。\n\n---\n\n[Reference 2 — Source: san_ming_tong_hui]\n运抑则頽弱则泛没更若冲并此身之主岂能安然恬静不摇无此理也】\n　　年月日时干支有序君臣賔主体格朝伦\n　　【月干宜在年干之次时干宜在日干之次若或循环次第又竒年爲君日爲主月时如賔如臣辅佐贵气兼似前法有次朝其纲常辅其伦序正其尊严又云阳欲慎独阴欲羣随仍察贵煞所加之处】\n　　日主最喜先干日主应嫌次位\n　　【日主先干如甲日见癸之类此等其益有三一能合戊财资我一能善于长发我一能化其象生我但巳往之气稍慢日主次位如甲见乙之类此等其损有四一能刼妻财空我一能合煞损我一能化象以泄我气一能拦截前路作刃害我】\n　　支神前气支神后宫\n　　【地支迎前之气多者平生爲人精神磊落如甲子年或子日见丑寅邜辰已之类是也地支后宫者主作事悔屯或折挫进退多端如甲子年或子日见亥戌申未之类是也余仿此】\n　　独掉嵗君孤虚日主\n\n---\n\n[Reference 3 — Source: di_tian_sui]\n抑之。是不可以一端论也。\n如日主旺，提纲或官或财或食伤，皆可为用；日主衰，别寻四柱干支有帮身者为用。提纲是禄刃，即以提纲为体，看其大势，以四柱干支食神财官，寻其得所者而用之。\n如四柱干支财杀过旺，日主旺中变弱，须寻其帮身制化财杀者而用之。日主为体者，日主旺，印绶多，必要财星为用；日主旺，官杀轻，亦以财星为用。日主旺，比劫多 ，耐我财星，以食伤为用；日主旺，比劫多，而财星轻，亦以食伤为用。日主旺，官星轻，銕绶重，以财星为用；日主弱，官杀旺，则以印绶为用，日主弱，食伤多，亦以印绶为用；日主弱，财星旺，则以比劫为用。日主与官杀两停者，则以食伤为用；日主与财星均敌者，则以印比为用。此皆用神之的当者也。\n如日主不能为力，合别干而化，化之真者，即以化神为体。化神有余，则以泄化神之神为用；化神不足，则以生助化神之神为用。\n\n--- Reference (Keyword: 偏财) ---\n[Reference 1 — Source: di_tian_sui]\n限量。（新增）\n\n壬辰\n壬寅\n甲寅\n庚午癸卯\n甲辰\n乙巳\n丙午\n丁未\n戊申\n己酉\n庚戌\n同邑王姓造。俗以身强杀浅论，取庚金为用，谓春木逢金，必作栋梁之器，劝其读书必发；至三旬外，不但读书未售，而且家业渐销，嘱余推之。观其支坐两寅，乘权当令，干透两壬，生助旺神，年支之辰土，乃水之库，木之余气，能蓄水养木，不能生金，一点庚金，休囚已极，且午火敌之，壬水泄之，不惟无用，反为生水之病。大凡旺之极者，宜泄而不宜克，宜顺其气势，弗悖其性也。以午火为用，将来运至火