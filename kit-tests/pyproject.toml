[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "community-test-kit"
version = "0.1.0"
description = "Curated, runnable slices of the your-repo test suite for interviews and the community."
requires-python = ">=3.11"
dependencies = [
  "pytest>=8",
  "hypothesis>=6",
]

# This is a test kit, not an importable package. Disable setuptools flat-layout
# auto-discovery (it otherwise errors on the many top-level data/tooling dirs)
# while still installing the run-time deps above.
[tool.setuptools]
py-modules = []
packages = []

# mutmut configuration (see 07_mutation_testing/). Run: `uv run mutmut run`
[tool.mutmut]
source_paths = ["src2/engine/"]
tests_dir = ["07_mutation_testing"]

[tool.pytest.ini_options]
testpaths = ["examples"]
python_files = ["test_*.py", "*_test.py", "0[1-9]_*.py"]
addopts = "-q"
